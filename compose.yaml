name: customer-support-multi-agent

x-api: &api
  build: .
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ignored .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 10

  crm-api:
    <<: *api
    command: >-
      sh -c "alembic upgrade head && python -m support_system.seed_crm &&
      uvicorn support_system.crm_api:app --host 0.0.0.0 --port 8000"
    environment:
      DB_HOST: postgres
      DB_NAME: support
      DB_USER: support
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRM_ACCOUNT_READ_TOKEN: ${CRM_ACCOUNT_READ_TOKEN:?set CRM_ACCOUNT_READ_TOKEN in ignored .env}
      CRM_BILLING_READ_TOKEN: ${CRM_BILLING_READ_TOKEN:?set CRM_BILLING_READ_TOKEN in ignored .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"

  logistics-api:
    <<: *api
    command: uvicorn support_system.logistics_api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8002:8000"

  agent-api:
    <<: *api
    command: uvicorn support_system.agent_api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
