name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: support
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: support
      DB_USER: support
      DB_PASSWORD: ci-only-password
      CRM_ACCOUNT_READ_TOKEN: ci-account-token
      CRM_BILLING_READ_TOKEN: ci-billing-token
      CRM_BILLING_REQUEST_TOKEN: ci-request-token
      CRM_BILLING_EXECUTE_TOKEN: ci-execute-token
      LOGISTICS_ORDER_READ_TOKEN: ci-logistics-token
      TECHNICAL_RETRIEVAL_TOKEN: ci-technical-token
      CUSTOMER_SESSION_SECRET: ci-only-session-secret-at-least-32-bytes
      ADMIN_SESSION_SECRET: ci-only-admin-secret-at-least-32-bytes
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Migrate and seed CRM
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python -m support_system.seed_crm
          uv run python -m support_system.seed_crm
          uv run python -m support_system.seed_articles
          uv run python -m support_system.seed_articles
          uv run alembic check
      - name: Tests
        run: uv run pytest -q
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-compose-only
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test stream parser
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
