[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-multi-agent"
version = "0.1.0"
description = "Backend foundation for a scoped customer support platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "faker>=37,<39",
  "fastapi>=0.115,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_system = ["support_articles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
